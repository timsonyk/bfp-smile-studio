server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets — safe to cache forever (filename changes on rebuild).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deploys are picked up instantly.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routing: unknown paths fall back to index.html (assets handled above → real 404).
    location / {
        try_files $uri /index.html;
    }
}
